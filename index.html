    <script type="importmap">
    {"imports":{
      "three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",

    <script type="module">
      // ─── Nysa Sphere — particle hologram (magenta) ────────────────────
      // Espone window.NysaBrainMount(container) → cleanup()
      // Genera una sfera perfetta di particelle — nessun file esterno.
      import * as THREE from 'three';
      import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
      import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
      import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
      import { OutputPass }     from 'three/addons/postprocessing/OutputPass.js';

      window.NysaBrainMount = function(container){
        const mobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ||
                       window.matchMedia('(pointer:coarse)').matches;
        const DPR = Math.min(devicePixelRatio || 1, mobile ? 1.5 : 1.75);

        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block;';
        container.appendChild(canvas);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias:!mobile, powerPreference:'high-performance' });
        renderer.setPixelRatio(DPR);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        const scene  = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
        camera.position.set(0, 0, mobile ? 6.2 : 5.5);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(new THREE.Vector2(2, 2), 0.18, 0.55, 0.0);
        composer.addPass(bloom);
        composer.addPass(new OutputPass());

        function size(){
          const W = Math.max(1, container.offsetWidth);
          const H = Math.max(1, container.offsetHeight);
          camera.aspect = W / H;
          camera.updateProjectionMatrix();
          renderer.setSize(W, H, false);
          composer.setSize(W, H);
          if(mobile) bloom.resolution.set(Math.floor(W*0.55), Math.floor(H*0.55));
        }
        size();
        const ro = new ResizeObserver(size);
        ro.observe(container);

        // sprite — nucleo bianco → magenta
        function makeSprite(){
          const s=64, cv=document.createElement('canvas');
          cv.width=cv.height=s;
          const g=cv.getContext('2d');
          const gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
          gr.addColorStop(0  ,'rgba(255,255,255,1)');
          gr.addColorStop(.2 ,'rgba(255,180,228,.95)');
          gr.addColorStop(.6 ,'rgba(236,0,140,.5)');
          gr.addColorStop(1  ,'rgba(140,0,84,0)');
          g.fillStyle=gr; g.beginPath(); g.arc(s/2,s/2,s/2,0,Math.PI*2); g.fill();
          return new THREE.CanvasTexture(cv);
        }

        const mat = new THREE.PointsMaterial({
          size: mobile ? 0.028 : 0.020,
          map: makeSprite(),
          transparent:true, depthWrite:false,
          blending:THREE.AdditiveBlending,
          vertexColors:true, sizeAttenuation:true,
        });

        // ─── Generate sphere point cloud ───
        const RADIUS = 1.44;
        const COUNT  = mobile ? 12000 : 38000;
        const targets   = new Float32Array(COUNT*3);
        const starts    = new Float32Array(COUNT*3);
        const positions = new Float32Array(COUNT*3);
        const colors    = new Float32Array(COUNT*3);
        const seeds     = new Float32Array(COUNT);

        const NEON     = new THREE.Color(0xEC008C);
        const NEON_HOT = new THREE.Color(0xFFD2EE);
        const col = new THREE.Color();

        for(let i=0;i<COUNT;i++){
          const i3=i*3;
          // target: uniform sphere surface via Fibonacci spiral
          const golden = Math.PI * (3 - Math.sqrt(5));
          const y  = 1 - (i / (COUNT-1)) * 2; // -1..1
          const r  = Math.sqrt(1 - y*y);
          const th = golden * i;
          targets[i3]   = Math.cos(th)*r*RADIUS;
          targets[i3+1] = y*RADIUS;
          targets[i3+2] = Math.sin(th)*r*RADIUS;

          // start: scattered cloud
          const sr  = 4+Math.random()*7;
          const sth = Math.random()*Math.PI*2;
          const sph = Math.acos(2*Math.random()-1);
          starts[i3]   = sr*Math.sin(sph)*Math.cos(sth);
          starts[i3+1] = sr*Math.sin(sph)*Math.sin(sth);
          starts[i3+2] = sr*Math.cos(sph);
          positions[i3]=starts[i3]; positions[i3+1]=starts[i3+1]; positions[i3+2]=starts[i3+2];

          seeds[i]=Math.random();
          col.copy(NEON).lerp(NEON_HOT, Math.pow(Math.random(),5));
          colors[i3]=col.r; colors[i3+1]=col.g; colors[i3+2]=col.b;
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
        geo.setAttribute('color',    new THREE.BufferAttribute(colors,3));
        const pts3D = new THREE.Points(geo, mat);
        scene.add(pts3D);

        let progress = 0;
        const spinSpeed = 0.10;
        let disposed = false;

        // pausa il rendering quando la sezione esce dal viewport
        let visible = true;
        const io = new IntersectionObserver((entries)=>{ visible = entries[0].isIntersecting; }, { rootMargin:'120px' });
        io.observe(container);

        const clock = new THREE.Clock();
        let raf = 0;

        function tick(){
          raf = requestAnimationFrame(tick);
          const dt = clock.getDelta();
          const t  = clock.elapsedTime;
          if(!visible) return;

          if(progress<1){
            progress = Math.min(1, progress + dt*0.28);
            const ease = 1-Math.pow(1-progress,3);
            const pos  = pts3D.geometry.attributes.position.array;
            const fade = 1-ease;
            for(let i=0;i<COUNT;i++){
              const i3=i*3, s=seeds[i];
              const n = fade*0.7;
              const nx = Math.sin(t*1.2+s*31)*n;
              const ny = Math.cos(t*1.0+s*43)*n;
              const nz = Math.sin(t*0.8+s*(48+s*18))*n;
              pos[i3]   = targets[i3]  *ease + starts[i3]  *(1-ease) + nx;
              pos[i3+1] = targets[i3+1]*ease + starts[i3+1]*(1-ease) + ny;
              pos[i3+2] = targets[i3+2]*ease + starts[i3+2]*(1-ease) + nz;
            }
            pts3D.geometry.attributes.position.needsUpdate=true;
          }

          pts3D.rotation.y += dt*spinSpeed;
          pts3D.rotation.x += dt*spinSpeed*0.08;
          mat.opacity = 0.88 + Math.sin(t*8.7)*.035 + Math.sin(t*22.3)*.015;
          composer.render();
        }
        raf = requestAnimationFrame(tick);

        return function cleanup(){
          disposed = true;
          cancelAnimationFrame(raf);
          ro.disconnect();
          io.disconnect();
          pts3D.geometry.dispose();
          mat.map && mat.map.dispose();
          mat.dispose();
          renderer.dispose();
          canvas.remove();
        };
      };
    </script>

// ── Brain hologram (Three.js, montato dal modulo in <head>) ─────────────
function BrainParticles() {
  const ref = React.useRef(null);

  React.useEffect(() => {
    let cleanup = null;
    let cancelled = false;

    function tryMount() {
      if (cancelled) return;
      if (window.NysaBrainMount && ref.current) {
        cleanup = window.NysaBrainMount(ref.current);
      } else {
        setTimeout(tryMount, 100); // il modulo ES si carica in parallelo a Babel
      }
    }
    tryMount();

    return () => {
      cancelled = true;
      if (cleanup) cleanup();
    };
  }, []);

  return <div ref={ref} style={{ position: 'absolute', inset: 0 }} />;
}

// ── Two Sides — Lenders & Borrowers (white, animata on-scroll) ───────────
function SidesSection() {
  const ref = React.useRef(null);
  const [inView, setInView] = React.useState(false);

  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      (entries) => {
        if (entries[0].isIntersecting) {
          setInView(true);
          io.disconnect();
        }
      },
      { threshold: 0.3 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);

  return (
    <section ref={ref} className={inView ? 'sides-section in' : 'sides-section'} id="participants">
      <div className="inner">
        <div className="sides-head">
          <div className="eyebrow">Lenders &amp; Borrowers</div>
          <h2 className="section-title">
            One protocol, <em>two</em> sides.
          </h2>
          <p>
            Every asset inside a Nysa market is selected through two layers of
            analysis. <b>Market research</b> identifies the assets with the
            highest real demand; <em>quantitative</em> analysis delivers
            risk-adjusted parameters — so both sides get a market that's
            efficient by design.
          </p>
        </div>

        <div className="sides-diagram">
          {/* Lenders */}
          <div className="sides-card lenders">
            <div className="role"><span className="dot"></span>Lenders</div>
            <h3>Earn <em style={{fontFamily:"'Instrument Serif', serif", fontStyle:'italic'}}>real</em> yield.</h3>
            <ul>
              <li>Higher APYs</li>
              <li>Wider lend asset selection</li>
              <li>Choose which market to lend in</li>
            </ul>
          </div>

          <div className="sides-connector left"><span className="wire"></span></div>

          {/* Center hub — Nysa logo + animated ring */}
          <div className="sides-hub">
            <svg className="sides-ring" viewBox="0 0 210 210" fill="none">
              <defs>
                <linearGradient id="sides-grad" x1="0" y1="0" x2="210" y2="210" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stopColor="#EC008C" />

                strokeLinecap="round" className="ring-draw" opacity="0.55" />

                strokeLinecap="round" strokeDasharray="42 524" className="ring-arc" />
